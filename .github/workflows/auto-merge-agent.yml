name: Auto-merge agent contributions

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          (startsWith(github.event.pull_request.head.ref, 'agent/') ||
           startsWith(github.event.pull_request.head.ref, 'assistant/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const pullId = pullRequest.node_id;
            const {owner, repo} = context.repo;
            const pull_number = pullRequest.number;

            try {
              await github.graphql(`mutation EnableAutoMerge($pullId: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $pullId, mergeMethod: SQUASH}) {
                  clientMutationId
                }
              }`, {
                pullId
              });
              core.info('Auto-merge enabled.');
            } catch (error) {
              if (error.errors?.some(e => e.type === 'FORBIDDEN')) {
                core.warning('Auto-merge could not be enabled due to repository settings.');
              } else if (error.errors?.some(e => e.type === 'UNPROCESSABLE')) {
                core.warning('Auto-merge is already enabled or the pull request is not mergeable yet.');
              } else {
                throw error;
              }
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ['auto-merge-enabled']
              });
              core.info('Applied tracking label to pull request.');
            } catch (labelError) {
              core.warning(`Could not add label: ${labelError.message}`);
            }
