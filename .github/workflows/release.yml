name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Verify tag matches manifest
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./module.json').version")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" package/module.json package/easy-grid-movement-"$GITHUB_REF_NAME".zip --generate-notes --title "$GITHUB_REF_NAME"
