name: Auto-approve agent contributions

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    name: Approve qualifying PR
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          (startsWith(github.event.pull_request.head.ref, 'agent/') ||
           startsWith(github.event.pull_request.head.ref, 'assistant/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Leave approval review
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number
            });

            const alreadyApproved = reviews.some(review => review.user?.login === 'github-actions[bot]' && review.state === 'APPROVED');
            if (alreadyApproved) {
              core.info('Pull request already has an approval from this workflow.');
            } else {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Automated approval for agent-authored changes.'
              });
              core.info('Submitted automated approval.');
            }
